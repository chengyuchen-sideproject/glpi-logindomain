name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3", "8.4"]
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in setup.php hook.php front/config.form.php src/LoginDomain.php tests/run_tests.php; do php -l "$f"; done
      - name: Unit tests
        run: php tests/run_tests.php
